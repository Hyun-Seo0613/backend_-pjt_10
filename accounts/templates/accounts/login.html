{% extends 'base.html' %}

{% block title %}로그인 | ThRead{% endblock title %}

{% block content %}
  <section class="form-panel form-panel--narrow card border-0 shadow-sm p-4 p-md-5">
    <p class="text-uppercase text-success small fw-semibold mb-1">다시 오신 걸 환영해요</p>
    <h1 class="h2 mb-2">로그인</h1>
    <p class="text-secondary mb-4">읽은 책과 기록을 이어서 만나 보세요.</p>
    <form action="{% url 'accounts:login' %}" method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">로그인</button>
    </form>
    <p class="small text-center mt-4 mb-0">처음 오셨나요? <a href="{% url 'accounts:signup' %}" class="link-success">회원가입</a></p>
  </section>
{% endblock content %}
